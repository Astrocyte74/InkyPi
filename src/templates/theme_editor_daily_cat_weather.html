<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Cat Weather Themes</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='styles/main.css') }}">
    <script src="{{ url_for('static', filename='scripts/response_modal.js') }}"></script>
    <style>
        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 16px;
            height: 100%;
            overflow: hidden;
        }
        .panel {
            border: 1px solid #dddddd;
            border-radius: 10px;
            padding: 12px;
            background: #fff;
            overflow: auto;
        }
        .panel h2 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .theme-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            margin-bottom: 8px;
        }
        .theme-item:hover {
            border-color: #d0d0d0;
            background: #fafafa;
        }
        .theme-item.active {
            border-color: #2c66b1;
            background: #eef4ff;
        }
        .theme-meta {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .theme-title {
            font-weight: 700;
            color: #222;
        }
        .theme-subtitle {
            font-size: 0.85rem;
            opacity: 0.8;
        }
        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid #ddd;
            white-space: nowrap;
        }
        .badge.builtin {
            background: #f1f5ff;
            color: #25427a;
            border-color: #cdd9ff;
        }
        .badge.local {
            background: #f2fff4;
            color: #1c5c2c;
            border-color: #c7f0cf;
        }
        .badge.override {
            background: #fff8e8;
            color: #7a4b00;
            border-color: #ffe0a6;
        }
        textarea.form-input {
            width: 100%;
            min-height: 110px;
            resize: vertical;
            padding: 0.5rem;
            font-size: 0.95rem;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .action-button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            background-color: #2c66b1;
            color: #fff;
        }
        .action-button.secondary {
            background-color: #f4f4f9;
            color: #333;
            border: 1px solid #ddd;
        }
        .action-button.danger {
            background-color: #E53935;
        }
        .hint {
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 6px;
            line-height: 1.3;
        }
        @media (max-width: 900px) {
            .editor-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="frame">
        <button onclick="history.back()" class="back-button">← Back</button>
        <div class="app-header">
            <div class="header-content">
                <div class="title-container">
                    <h1 class="app-title">Daily Cat Weather Themes</h1>
                </div>
            </div>
        </div>
        <div class="separator"></div>

        <div class="editor-grid">
            <div class="panel" id="themeListPanel">
                <h2>Themes</h2>
                <div id="themeList"></div>
                <div class="separator"></div>
                <div class="hint">
                    Saved overrides live at <code id="localPath"></code>.
                </div>
            </div>

            <div class="panel">
                <h2>Editor</h2>
                <div class="form-group">
                    <label for="themeId" class="form-label">Theme ID</label>
                    <input type="text" id="themeId" class="form-input" placeholder="e.g. retro_dog" />
                </div>
                <div class="form-group">
                    <label for="themeLabel" class="form-label">Label</label>
                    <input type="text" id="themeLabel" class="form-input" placeholder="Shown in dropdowns" />
                </div>
                <div class="form-group">
                    <label for="characterNoun" class="form-label">Character Noun</label>
                    <input type="text" id="characterNoun" class="form-input" placeholder="cat / dog / composition" />
                </div>
                <div class="form-group" style="align-items: flex-start;">
                    <label for="characterPrompt" class="form-label">Character Prompt</label>
                    <textarea id="characterPrompt" class="form-input" placeholder="Main subject description..."></textarea>
                </div>
                <div class="form-group" style="align-items: flex-start;">
                    <label for="stylePrompt" class="form-label">Style Prompt</label>
                    <textarea id="stylePrompt" class="form-input" placeholder="PRIMARY art direction..."></textarea>
                </div>
                <div class="form-group" style="align-items: flex-start;">
                    <label for="styleAvoid" class="form-label">Avoid Prompt</label>
                    <textarea id="styleAvoid" class="form-input" placeholder="Avoid ..."></textarea>
                </div>
                <div class="hint">
                    Saving always writes a local override file; built-in themes stay unchanged.
                </div>
                <div class="button-row">
                    <button class="action-button secondary" type="button" id="newTheme">New</button>
                    <button class="action-button secondary" type="button" id="duplicateTheme">Duplicate</button>
                    <button class="action-button" type="button" id="saveTheme">Save</button>
                    <button class="action-button danger" type="button" id="deleteTheme">Delete Local</button>
                </div>
            </div>
        </div>

        {% include "response_modal.html" %}
    </div>

    <script>
        let themes = [];
        let selectedId = null;

        function byId(id) { return document.getElementById(id); }

        function badgeFor(theme) {
            if (theme.source === 'local' && theme.is_override) return '<span class="badge override">override</span>';
            if (theme.source === 'local') return '<span class="badge local">local</span>';
            return '<span class="badge builtin">builtin</span>';
        }

        function renderList() {
            const list = byId('themeList');
            list.innerHTML = '';
            const sorted = [...themes].sort((a, b) => {
                if (a.id === 'storybook') return -1;
                if (b.id === 'storybook') return 1;
                return (a.label || a.id).localeCompare(b.label || b.id);
            });

            sorted.forEach(theme => {
                const item = document.createElement('div');
                item.className = 'theme-item' + (theme.id === selectedId ? ' active' : '');
                item.innerHTML = `
                    <div class="theme-meta">
                        <div class="theme-title">${theme.label || theme.id}</div>
                        <div class="theme-subtitle">${theme.id}</div>
                    </div>
                    ${badgeFor(theme)}
                `;
                item.addEventListener('click', () => selectTheme(theme.id));
                list.appendChild(item);
            });
        }

        function currentTheme() {
            return themes.find(t => t.id === selectedId) || null;
        }

        function formValue(id) { return (byId(id).value || '').trim(); }

        function setForm(theme) {
            byId('themeId').value = theme?.id || '';
            byId('themeLabel').value = theme?.label || '';
            byId('characterNoun').value = theme?.character?.noun || '';
            byId('characterPrompt').value = theme?.character?.prompt || '';
            byId('stylePrompt').value = theme?.style?.prompt || '';
            byId('styleAvoid').value = theme?.style?.avoid || '';
        }

        function selectTheme(id) {
            selectedId = id;
            const theme = themes.find(t => t.id === id);
            if (theme) setForm(theme);
            renderList();
            updateDeleteButton();
        }

        function updateDeleteButton() {
            const theme = currentTheme();
            const btn = byId('deleteTheme');
            btn.disabled = !(theme && theme.source === 'local');
        }

        async function loadThemes() {
            const response = await fetch('{{ url_for("themes.api_daily_cat_weather_themes") }}');
            const data = await response.json();
            if (!response.ok) {
                showResponseModal('failure', data.error || 'Failed to load themes');
                return;
            }
            themes = data.themes || [];
            byId('localPath').textContent = data.local_path || '';

            if (!selectedId) {
                selectedId = 'storybook';
            }
            if (!themes.find(t => t.id === selectedId) && themes.length) {
                selectedId = themes[0].id;
            }
            selectTheme(selectedId);
        }

        async function saveTheme() {
            const payload = {
                theme: {
                    id: formValue('themeId'),
                    label: formValue('themeLabel'),
                    character: {
                        noun: formValue('characterNoun'),
                        prompt: byId('characterPrompt').value || '',
                    },
                    style: {
                        prompt: byId('stylePrompt').value || '',
                        avoid: byId('styleAvoid').value || '',
                    }
                }
            };
            const response = await fetch('{{ url_for("themes.api_daily_cat_weather_save_theme") }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await response.json();
            if (!response.ok) {
                showResponseModal('failure', data.error || 'Failed to save theme');
                return;
            }
            showResponseModal('success', data.message || 'Saved');
            selectedId = payload.theme.id.toLowerCase().replace(/[^a-z0-9_]+/g, '');
            await loadThemes();
        }

        async function deleteTheme() {
            const theme = currentTheme();
            if (!theme || theme.source !== 'local') return;
            const ok = confirm(`Delete local theme '${theme.id}'? (Built-in theme will reappear if this was an override.)`);
            if (!ok) return;
            const response = await fetch(`/api/themes/daily_cat_weather/${encodeURIComponent(theme.id)}`, {
                method: 'DELETE',
            });
            const data = await response.json();
            if (!response.ok) {
                showResponseModal('failure', data.error || 'Failed to delete theme');
                return;
            }
            showResponseModal('success', data.message || 'Deleted');
            await loadThemes();
        }

        function newTheme() {
            selectedId = null;
            setForm({
                id: '',
                label: '',
                character: { noun: 'cat', prompt: '' },
                style: { prompt: '', avoid: '' },
            });
            renderList();
            updateDeleteButton();
        }

        function duplicateTheme() {
            const theme = currentTheme();
            if (!theme) return;
            const copy = JSON.parse(JSON.stringify(theme));
            copy.id = `${theme.id}_copy`;
            copy.label = `${theme.label || theme.id} (Copy)`;
            selectedId = null;
            setForm(copy);
            renderList();
            updateDeleteButton();
        }

        document.addEventListener('DOMContentLoaded', () => {
            byId('saveTheme').addEventListener('click', saveTheme);
            byId('deleteTheme').addEventListener('click', deleteTheme);
            byId('newTheme').addEventListener('click', newTheme);
            byId('duplicateTheme').addEventListener('click', duplicateTheme);
            loadThemes();
        });
    </script>
</body>
</html>
